<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Kairos</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/customer-pages/style.css">
  <link rel="stylesheet" href="/static/customer-pages/login.css">
</head>
<body>
  <div id="nav-placeholder"></div>

  <main id="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <span>Kairos</span>
        <p>Your account. Your style.</p>
      </div>

      <!-- TABS -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Login</button>
        <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Register</button>
      </div>

      <!-- LOGIN FORM -->
      <form id="login-form" class="auth-form" onsubmit="handleLogin(event)">
        <div class="field-group">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" placeholder="you@email.com" required>
        </div>
        <div class="field-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="Your password" required>
        </div>
        <p id="login-msg" class="auth-msg"></p>
        <button type="submit" class="btn-fill auth-submit">Login to My Account</button>
        <p class="auth-switch">Don't have an account? <a href="#" onclick="switchTab('register');return false">Register here</a></p>
      </form>

      <!-- REGISTER FORM -->
      <form id="register-form" class="auth-form hidden" onsubmit="handleRegister(event)">
        <div class="field-group">
          <label for="reg-name">Full Name</label>
          <input type="text" id="reg-name" placeholder="Your full name" required>
        </div>
        <div class="field-group">
          <label for="reg-email">Email Address</label>
          <input type="email" id="reg-email" placeholder="you@email.com" required>
        </div>
        <div class="field-group">
          <label for="reg-phone">Phone Number (optional)</label>
          <input type="tel" id="reg-phone" placeholder="0300 0000000">
        </div>
        <div class="field-group">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" placeholder="Choose a password" required minlength="6">
        </div>
        <p id="register-msg" class="auth-msg"></p>
        <button type="submit" class="btn-fill auth-submit">Create Account</button>
        <p class="auth-switch">Already have an account? <a href="#" onclick="switchTab('login');return false">Login here</a></p>
      </form>
    </div>
  </main>

  <div id="footer-placeholder"></div>
  <script src="/static/customer-pages/login.js"></script>
  <script src="/static/customer-pages/nav.js"></script>
</body>
</html>
